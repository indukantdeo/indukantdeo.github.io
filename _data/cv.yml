    - title: Senior Engineer, Machine Learning
      institution: Corning Inc., Vancouver, BC / Montreal, QC
      year: 2025 - Present
      description:
        - Built a from-scratch LLM inference simulator in Python to model distributed inference under different network and HPC configurations, producing latency, time-to-first-token (TTFT), and time-per-output-token (TPOT) estimates.
        - Used AstraSim to simulate distributed training strategies across network, hardware, and workload assumptions for AI-driven systems and ML infrastructure decisions.
        - Implemented and benchmarked data, model, and hybrid parallelism, quantifying communication overheads and performance trade-offs for distributed deep learning workloads.
        - Modeled the impact of optical-fiber latency on GPU compute-communication overlap for network-aware AI infrastructure across geographically distributed systems.
    - title: Data Science Summer Institute Intern, libROM Team
      institution: Lawrence Livermore National Laboratory, Livermore, CA, USA
      year: 2024
      description:
        - Developed scalable data-driven reduced-order models for large-scale LPBF (metal additive manufacturing) distortion prediction, combining scientific ML, HPC, and AI-driven surrogate modeling.
        - Ran large-scale Ansys Mechanical simulations on 112 HPC cores to generate high-fidelity training and validation data.
        - Built and benchmarked POD-GP and graph-autoencoder models, achieving distortion prediction accuracy within 1e-3 mm.
        - Reduced simulation turnaround time by approximately 1800x using a POD-GP reduced-order model.
        - Applied Gaussian Process Regression for uncertainty quantification to assess reliability under varying process parameters.
    - title: MITACS Accelerate Intern
      institution: Clear Seas, Vancouver, Canada
      year: 2023 - 2025
      description:
        - Engineered AI surrogate models that transformed expensive physics-based acoustic simulations into scalable, real-time prediction tools for operational decision support.
        - Built large-scale acoustic simulation datasets using HPC workflows and the BELLHOP solver.
        - Developed a range-conditional convolutional neural network (RC-CAN) to predict acoustic transmission loss across varying bathymetry and source-receiver configurations.
        - Introduced a continual learning framework for adapting dynamical-system models across changing bathymetric environments without full retraining.
        - Supported a multi-objective optimization framework for reducing ship-noise exposure to marine mammals.
    - title: Graduate Research Assistant, AI Team
      institution: Computational Multi-physics Lab, University of British Columbia, Vancouver, Canada
      year: 2020 - 2025
      description:
        - Developed convolutional autoencoder, recurrent, and attention-based deep learning architectures for long-horizon wave and fluid-dynamics forecasting.
        - Improved time-series forecasting performance by 5x over RNN-LSTM baselines for spatio-temporal data.
        - Built a space-time reduced-order model with 3D convolutional kernels, published in Physics of Fluids (Editor's Pick).
        - Developed attention and loss-decomposition methods inspired by numerical time integration for long-horizon prediction reliability.
        - Published research on graph neural networks, reduced-order modeling, physics-guided ML, and uncertainty-aware prediction across fluids, acoustics, and scientific computing.

